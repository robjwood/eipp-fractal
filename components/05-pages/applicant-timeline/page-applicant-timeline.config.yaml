label: Applicant timeline
context:
  primaryNav: '@global-nav'
  pubShortAddress: The Red Lion Solihull
  applicantName: Bob Smith, Sarah Smith

  
  actionsHeader:  <table class="table-timeline u-mb2">
                    <thead>
                      <tr>
                        <th class="w-50">Description</th>
                        <th class="w-40">Actions</th>
                        <th class="w-10">Status</th>
                      </tr>
                    </thead>
                  </table>
                  <p><strong>Your actions to do</strong></p>

  # actionsHeader:  <table class="table-timeline">
  #                   <thead>
  #                     <tr>
  #                       <th class="w-33">Description</th>
  #                       <th class="w-33">Actions</th>
  #                       <th class="w-25">Status</th>
  #                     </tr>
  #                   </thead>
