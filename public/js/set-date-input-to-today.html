<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Setting a date input to today's date with vanilla JS</title>
</head>
<body>
  <h1>Set today's date using vanilla JavaScript</h1>

  
  <label for="today">
    The Date
    <span class="description"> Please use the YYYY-MM-DD format</span>
  </label>
  <input id="today" type="date" class="js-today"
    pattern="(?:19|20)[0-9]{2}-(?:(?:0[1-9]|1[0-2])-(?:0[1-9]|1[0-9]|2[0-9])|(?:(?!02)(?:0[1-9]|1[0-2])-(?:30))|(?:(?:0[13578]|1[02])-31))"
    placeholder="DD-MM-YYYY">
  
  <script>
    // Polyfill for padStart to work in IE6. You'll see later ...
    if (!String.prototype.padStart) {
      String.prototype.padStart = function padStart(targetLength,padString) {
        targetLength = targetLength>>0; //truncate if number or convert non-number to 0;
        padString = String((typeof padString !== 'undefined' ? padString : ' '));
        if (this.length > targetLength) {
          return String(this);
        }
        else {
          targetLength = targetLength-this.length;
          if (targetLength > padString.length) {
            padString += padString.repeat(targetLength/padString.length); //append to original to ensure we are longer than needed
          }
          return padString.slice(0,targetLength) + String(this);
        }
      };
    }


    /**
     * Test if the browser supports input[type="date"]
     * @return {Boolean} Returns true if it's supported
     */
    var isDateSupported = function () {
      var input = document.createElement('input');
      input.setAttribute('type', 'date');
      input.setAttribute('value', 'x');
      return (input.value !== 'x');
    };


    var field = document.querySelector('.js-today');
    var date = new Date();



    // If [type="date"] is supported, update the DOM
    if (isDateSupported()) {

      // Remove attributes
      field.removeAttribute('pattern');
      field.removeAttribute('placeholder');

      // Remove the helper text
      var helperText = document.querySelector('[for="today"] .description');
      if (helperText) {
        helperText.parentNode.removeChild(helperText);
      }

    }

    // Set the date
    // From the Date() object, we'll get the day, month and year and convert them to a string (with toString) and concatenate them to a single value.
    // Use getFullYear() to get the year in a four-character format, getMonth() for the month, and getDate() to get the day.

    // getMonth() returns the month as a number starting with 0. This means we need to add 1 to our result to get the correct date.

    // getMonth() and getDate() are missing leading zeros for single digit months/days because they're numbers and not strings. 
    // We can use the padStart() method to add those if missing.

    field.value = date.getFullYear().toString() + '-' + (date.getMonth() + 1).toString().padStart(2, 0) + '-' + date.getDate().toString().padStart(2, 0);




  </script>
</body>
</html>
